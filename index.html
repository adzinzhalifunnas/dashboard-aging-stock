<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Aging Stock</title>
<meta name="description" content="Dashboard aging stock Kategori Sepatu dan Sandal Anak: mencegah aging stock baru, mengatur alokasi per kelompok toko, dan memindahkan stok antartoko.">
<link rel="stylesheet" href="style.css">
<script>
  /* apply the saved theme before first paint; light is the default */
  try { if (localStorage.getItem("tema") === "gelap") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#konten">Lewati ke konten</a>
<div class="app viz-root">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </span>
      <div class="brand-text">
        <h1>Dashboard Aging Stock</h1>
        <p class="sub" id="subjudul">Kategori Sepatu dan Sandal Anak · PT Ritel Fashion XYZ Tbk</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="meta-chip" id="chip-posisi"><span class="dot" aria-hidden="true"></span>Posisi stok 30 Sep 2026</span>
      <button class="icon-btn" id="tema" type="button" aria-pressed="false" aria-label="Aktifkan mode gelap" title="Aktifkan mode gelap">
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Bagian dashboard">
    <button role="tab" id="tab-ringkasan" aria-controls="panel-ringkasan" aria-selected="true"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Ringkasan</span></button>
    <button role="tab" id="tab-ml" aria-controls="panel-ml" aria-selected="false" tabindex="-1"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21h4"/></svg><span>Cegah aging baru</span></button>
    <button role="tab" id="tab-graph" aria-controls="panel-graph" aria-selected="false" tabindex="-1"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 8.2l2.6 7.4M15.8 7.8l-2.7 7.8M8.5 6.8l7-.6"/></svg><span>Atur alokasi toko</span></button>
    <button role="tab" id="tab-transfer" aria-controls="panel-transfer" aria-selected="false" tabindex="-1"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg><span>Pindahkan stok</span></button>
    <button role="tab" id="tab-tentang" aria-controls="panel-tentang" aria-selected="false" tabindex="-1"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.2"/></svg><span>Tentang data</span></button>
  </nav>

  <section class="filters" aria-label="Filter">
    <label class="field"><span class="field-label">Zona</span>
      <span class="select"><svg class="field-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><select id="f-zona"></select></span></label>
    <label class="field"><span class="field-label">Toko</span>
      <span class="select"><svg class="field-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12.5V20h13v-7.5M10 20v-4.5h4V20"/></svg><select id="f-toko"></select></span></label>
    <label class="field"><span class="field-label">Product group</span>
      <span class="select"><svg class="field-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 12.6V4.5a1 1 0 0 1 1-1h8.1l8 8a1.4 1.4 0 0 1 0 2l-7 7a1.4 1.4 0 0 1-2 0z"/><circle cx="8.3" cy="8.3" r="1.4"/></svg><select id="f-kelompok"></select></span></label>
    <button type="button" class="reset" id="f-reset" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.3h4.3"/></svg>Reset</button>
    <span class="scope" id="f-ringkas" aria-live="polite"></span>
  </section>

  <main id="konten" tabindex="-1">
    <section class="panel" role="tabpanel" id="panel-ringkasan" aria-labelledby="tab-ringkasan">
      <div class="page" id="isi-ringkasan"></div>
    </section>
    <section class="panel" role="tabpanel" id="panel-ml" aria-labelledby="tab-ml" hidden>
      <div class="page" id="isi-ml"></div>
    </section>
    <section class="panel" role="tabpanel" id="panel-graph" aria-labelledby="tab-graph" hidden>
      <div class="page" id="isi-graph"></div>
    </section>
    <section class="panel" role="tabpanel" id="panel-transfer" aria-labelledby="tab-transfer" hidden>
      <div class="page" id="isi-transfer"></div>
    </section>
    <section class="panel" role="tabpanel" id="panel-tentang" aria-labelledby="tab-tentang" hidden>
      <div class="page" id="isi-tentang"></div>
    </section>
  </main>

  <footer class="foot" id="kaki"></footer>
</div>
<div class="tooltip" id="tooltip" role="status" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
